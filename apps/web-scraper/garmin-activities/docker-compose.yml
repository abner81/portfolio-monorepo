services:
  postgres:
    container_name: ${GARMIN_DB_CONTAINER_NAME}
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    env_file:
      - ../../../.env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - fitness-tracker-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'
    logging:
      options:
        max-size: '10m'
        max-file: '3'

networks:
  fitness-tracker-network:
    driver: bridge
volumes:
  postgres_data:
    driver: local
